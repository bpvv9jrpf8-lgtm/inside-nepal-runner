name: Inside Nepal Hindu Reel Test

on:
  workflow_dispatch:

jobs:
  build-hindu-test-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install requirements
        working-directory: private-code
        run: pip install -r requirements.txt

      - name: Locate bundled FFmpeg
        working-directory: private-code
        shell: bash
        run: |
          FFMPEG_PATH="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFmpeg: $FFMPEG_PATH"
          "$FFMPEG_PATH" -version | head -n 1
          echo "FFMPEG_BIN=$FFMPEG_PATH" >> "$GITHUB_ENV"

      - name: Generate respectful Hindu deity-first V4 reel
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          FFMPEG_BIN: ${{ env.FFMPEG_BIN }}
        run: python hindu_v4.py

      - name: Upload Hindu V4 test reel
        uses: actions/upload-artifact@v4
        with:
          name: inside-nepal-hindu-v4-test
          path: |
            private-code/output-hindu-v4/inside-nepal-hindu-v4-test.mp4
            private-code/output-hindu-v4/voice-creator-news.mp3
            private-code/output-hindu-v4/content.json
            private-code/output-hindu-v4/media-credits.json
          retention-days: 1
