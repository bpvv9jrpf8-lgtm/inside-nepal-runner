name: Inside Nepal Buffer Reel Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install requirements
        run: |
          pip install -r private-code/requirements.txt
          pip install cloudinary

      - name: Locate bundled FFmpeg
        working-directory: private-code
        run: |
          FFMPEG_PATH="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFMPEG_BIN=$FFMPEG_PATH" >> "$GITHUB_ENV"

      - name: Validate required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          set -euo pipefail
          for n in OPENAI_API_KEY PIXABAY_API_KEY CLOUDINARY_URL BUFFER_API_TOKEN BUFFER_CHANNEL_ID; do
            [ -n "${!n:-}" ] || { echo "$n missing"; exit 1; }
          done

      - name: Generate verified Inside Nepal Reel
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FFMPEG_BIN: ${{ env.FFMPEG_BIN }}
        run: python main.py

      - name: Upload Reel to Cloudinary
        id: host
        working-directory: private-code
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          python - <<'PY' > cloudinary-result.json
          import os, json
          import cloudinary, cloudinary.uploader
          raw=os.environ['CLOUDINARY_URL'].strip().strip('"').strip("'")
          if raw.startswith('CLOUDINARY_URL='):
              raw=raw.split('=',1)[1].strip().strip('"').strip("'")
          if not raw.startswith('cloudinary://'):
              raise SystemExit('Invalid CLOUDINARY_URL')
          body=raw[len('cloudinary://'):]
          cred,cloud=body.rsplit('@',1)
          key,secret=cred.split(':',1)
          cloud=cloud.split('?',1)[0].strip('/')
          cloudinary.config(cloud_name=cloud,api_key=key,api_secret=secret,secure=True)
          r=cloudinary.uploader.upload('output/inside-nepal-v2-cedar.mp4',resource_type='video',folder='inside-nepal-reels',overwrite=False)
          print(json.dumps({'url':r['secure_url']}))
          PY
          URL=$(jq -r '.url // empty' cloudinary-result.json)
          [ -n "$URL" ] || { echo 'Cloudinary URL missing'; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build Facebook caption
        id: caption
        working-directory: private-code
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('output/verification.json',encoding='utf-8'))
          hook=p.get('hook','नेपालको नयाँ अपडेट').strip()
          script=p.get('script','').strip()
          text=f"{hook}\n\n{script}\n\nतपाईंलाई यो अपडेट कस्तो लाग्यो?\n\n#InsideNepal #Nepal #NepalNews #Nepali #नेपाल"
          print('text<<EOF')
          print(text)
          print('EOF')
          PY

      - name: Send Reel to Buffer
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          POST_TEXT: ${{ steps.caption.outputs.text }}
          VIDEO_URL: ${{ steps.host.outputs.url }}
        run: |
          set -euo pipefail
          DUE_AT=$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%S.000Z')
          QUERY='mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id text dueAt status assets { id mimeType source } } } ... on MutationError { message } } }'
          jq -n --arg query "$QUERY" --arg text "$POST_TEXT" --arg channel "$BUFFER_CHANNEL_ID" --arg due "$DUE_AT" --arg video "$VIDEO_URL" '{query:$query,variables:{input:{text:$text,channelId:$channel,metadata:{facebook:{type:"reel"}},schedulingType:"automatic",mode:"customScheduled",dueAt:$due,assets:[{video:{url:$video}}]}}}' > buffer.json
          HTTP=$(curl -sS -o buffer-response.json -w '%{http_code}' -X POST 'https://api.buffer.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $BUFFER_API_TOKEN" --data-binary @buffer.json)
          cat buffer-response.json | jq . || true
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1
          ERR=$(jq -r '.errors[0].message // .data.createPost.message // empty' buffer-response.json)
          ID=$(jq -r '.data.createPost.post.id // empty' buffer-response.json)
          [ -z "$ERR" ] && [ -n "$ID" ] || { echo "$ERR"; exit 1; }
          echo "Inside Nepal Buffer Reel created: $ID"
