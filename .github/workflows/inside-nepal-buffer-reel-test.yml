name: Inside Nepal Buffer Reel Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inside-nepal-buffer-reel-test.yml'

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install requirements
        run: |
          pip install -r private-code/requirements.txt
          pip install cloudinary

      - name: Locate bundled FFmpeg
        working-directory: private-code
        run: |
          FFMPEG_PATH="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFMPEG_BIN=$FFMPEG_PATH" >> "$GITHUB_ENV"

      - name: Validate required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          CLOUDINARY_RAW: ${{ secrets.CLOUDINARY_URL }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          set -euo pipefail
          for n in OPENAI_API_KEY PIXABAY_API_KEY AZURE_SPEECH_KEY AZURE_SPEECH_REGION CLOUDINARY_RAW BUFFER_API_TOKEN BUFFER_CHANNEL_ID; do
            [ -n "${!n:-}" ] || { echo "$n missing"; exit 1; }
          done

      - name: Generate V7 Azure Nepali Inside Nepal Reel
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_VOICE: ne-NP-SagarNeural
          FFMPEG_BIN: ${{ env.FFMPEG_BIN }}
          INSIDE_NEPAL_REEL_MODE: news_roundup
        run: python reel_v7.py

      - name: Upload Reel to Cloudinary
        id: host
        working-directory: private-code
        env:
          CLOUDINARY_RAW: ${{ secrets.CLOUDINARY_URL }}
        run: |
          python - <<'PY' > cloudinary-result.json
          import os, json
          raw=os.environ['CLOUDINARY_RAW'].strip().strip('"').strip("'")
          if raw.startswith('CLOUDINARY_URL='):
              raw=raw.split('=',1)[1].strip().strip('"').strip("'")
          if not raw.startswith('cloudinary://'):
              raise SystemExit('Invalid Cloudinary secret format')
          body=raw[len('cloudinary://'):]
          cred,cloud=body.rsplit('@',1)
          key,secret=cred.split(':',1)
          cloud=cloud.split('?',1)[0].strip('/')
          import cloudinary
          import cloudinary.uploader
          cloudinary.config(cloud_name=cloud,api_key=key,api_secret=secret,secure=True)
          r=cloudinary.uploader.upload('output/inside-nepal-v7.mp4',resource_type='video',folder='inside-nepal-reels',overwrite=False)
          print(json.dumps({'url':r['secure_url']}))
          PY
          URL=$(jq -r '.url // empty' cloudinary-result.json)
          [ -n "$URL" ] || exit 1
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build Facebook caption
        id: caption
        working-directory: private-code
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('output/verification.json',encoding='utf-8'))
          hook=p.get('hook','नेपालको नयाँ अपडेट').strip()
          script=p.get('script','').strip()
          text=f"{hook}\n\n{script}\n\nतपाईंलाई यो अपडेट कस्तो लाग्यो?\n\n#InsideNepal #Nepal #NepalNews #Nepali #नेपाल"
          print('text<<EOF')
          print(text)
          print('EOF')
          PY

      - name: Send Azure Reel to Buffer Queue
        id: buffer
        continue-on-error: true
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          POST_TEXT: ${{ steps.caption.outputs.text }}
          VIDEO_URL: ${{ steps.host.outputs.url }}
        run: |
          QUERY='mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id text dueAt status assets { id mimeType source } } } ... on MutationError { message } } }'
          jq -n --arg query "$QUERY" --arg text "$POST_TEXT" --arg channel "$BUFFER_CHANNEL_ID" --arg video "$VIDEO_URL" '{query:$query,variables:{input:{text:$text,channelId:$channel,metadata:{facebook:{type:"reel"}},schedulingType:"automatic",mode:"addToQueue",assets:[{video:{url:$video}}]}}}' > buffer.json
          HTTP=$(curl -sS -o buffer-response.json -w '%{http_code}' -X POST 'https://api.buffer.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $BUFFER_API_TOKEN" --data-binary @buffer.json)
          jq -n --arg http "$HTTP" --slurpfile response buffer-response.json '{http_status:$http,response:$response[0]}' > inside-nepal-buffer-debug.json
          cat inside-nepal-buffer-debug.json

      - name: Save Buffer diagnostic
        if: always()
        run: |
          if [ -f inside-nepal-buffer-debug.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add inside-nepal-buffer-debug.json
            git commit -m 'Update Inside Nepal Buffer diagnostic' || true
            git push || true
          fi

      - name: Validate Buffer result
        run: |
          ID=$(jq -r '.response.data.createPost.post.id // empty' inside-nepal-buffer-debug.json)
          ERR=$(jq -r '.response.errors[0].message // .response.data.createPost.message // empty' inside-nepal-buffer-debug.json)
          [ -n "$ID" ] || { echo "Buffer error: $ERR"; exit 1; }
          echo "V7 Buffer reel created: $ID"
