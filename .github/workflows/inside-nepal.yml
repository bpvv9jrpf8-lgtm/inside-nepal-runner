name: Inside Nepal Reels Runner

on:
  workflow_dispatch:

jobs:
  build-test-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code

      - name: Locate FFmpeg tools
        shell: bash
        run: |
          FFMPEG_PATH="$(command -v ffmpeg)"
          FFPROBE_PATH="$(command -v ffprobe)"
          echo "FFmpeg: $FFMPEG_PATH"
          echo "FFprobe: $FFPROBE_PATH"
          "$FFMPEG_PATH" -version | head -n 1
          "$FFPROBE_PATH" -version | head -n 1
          echo "FFMPEG_BIN=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "FFPROBE_BIN=$FFPROBE_PATH" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install Python requirements
        working-directory: private-code
        run: pip install -r requirements.txt

      - name: Generate improved test reels
        working-directory: private-code
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FFMPEG_BIN: ${{ env.FFMPEG_BIN }}
          FFPROBE_BIN: ${{ env.FFPROBE_BIN }}
        run: python main.py

      - name: Upload improved test reels
        uses: actions/upload-artifact@v4
        with:
          name: inside-nepal-improved-test-reels
          path: |
            private-code/output/inside-nepal-test-male.mp4
            private-code/output/inside-nepal-test-female.mp4
          retention-days: 1
