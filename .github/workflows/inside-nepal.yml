name: Inside Nepal Reels Runner

on:
  workflow_dispatch:

jobs:
  run-inside-nepal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code

      - name: Test private repo access
        run: |
          echo "Private repo connected successfully"
          ls -la private-code
