name: Inside Nepal Reels Runner

on:
  workflow_dispatch:

jobs:
  build-v2-test-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install Python requirements
        working-directory: private-code
        run: pip install -r requirements.txt

      - name: Locate bundled FFmpeg
        working-directory: private-code
        shell: bash
        run: |
          FFMPEG_PATH="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFmpeg: $FFMPEG_PATH"
          "$FFMPEG_PATH" -version | head -n 1
          echo "FFMPEG_BIN=$FFMPEG_PATH" >> "$GITHUB_ENV"

      - name: Generate Inside Nepal V2 test reel
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FFMPEG_BIN: ${{ env.FFMPEG_BIN }}
        run: python main.py

      - name: Upload V2 test reel
        uses: actions/upload-artifact@v4
        with:
          name: inside-nepal-v2-test
          path: |
            private-code/output/inside-nepal-v2-test.mp4
            private-code/output/verification.json
          retention-days: 1
