name: Inside Nepal Reel Publish Only

on:
  workflow_run:
    workflows: ['Inside Nepal Reel Build']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Inside Nepal Reel Build run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: inside-nepal-reel-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve source reel build run
        id: source
        shell: bash
        env:
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_run' ]; then RUN_ID="$AUTO_RUN_ID"; else RUN_ID="$MANUAL_RUN_ID"; fi
          [ -n "$RUN_ID" ] || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download saved reel package
        uses: actions/download-artifact@v4
        with:
          name: inside-nepal-reel-${{ steps.source.outputs.run_id }}
          path: inside-nepal-reel-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Publish exact saved reel to Buffer
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          set -euo pipefail
          POST_TEXT=$(jq -r '.text' inside-nepal-reel-package/publish.json)
          VIDEO_URL=$(jq -r '.video_url' inside-nepal-reel-package/publish.json)
          DUE_AT=$(date -u -d '+25 minutes' '+%Y-%m-%dT%H:%M:00.000Z')
          QUERY='mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id dueAt status } } ... on MutationError { message } } }'
          jq -n --arg query "$QUERY" --arg text "$POST_TEXT" --arg channel "$BUFFER_CHANNEL_ID" --arg due "$DUE_AT" --arg video "$VIDEO_URL" '{query:$query,variables:{input:{text:$text,channelId:$channel,metadata:{facebook:{type:"reel"}},schedulingType:"automatic",mode:"customScheduled",dueAt:$due,assets:[{video:{url:$video}}]}}}' > buffer.json
          HTTP=$(curl -sS -o response.json -w '%{http_code}' -X POST 'https://api.buffer.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $BUFFER_API_TOKEN" --data-binary @buffer.json)
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1
          ERR=$(jq -r '.errors[0].message // .data.createPost.message // empty' response.json); ID=$(jq -r '.data.createPost.post.id // empty' response.json)
          [ -z "$ERR" ] && [ -n "$ID" ] || { echo "$ERR"; exit 1; }
          echo "Inside Nepal saved reel published: $ID"
