name: Inside Nepal Photo Publish Only

on:
  workflow_run:
    workflows: ['Inside Nepal Generate Package']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Inside Nepal Generate Package run ID to reuse'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: inside-nepal-photo-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve source generation run
        id: source
        shell: bash
        env:
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_run' ]; then RUN_ID="$AUTO_RUN_ID"; else RUN_ID="$MANUAL_RUN_ID"; fi
          [ -n "$RUN_ID" ] || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download saved package
        uses: actions/download-artifact@v4
        with:
          name: inside-nepal-package-${{ steps.source.outputs.run_id }}
          path: inside-nepal-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Install hosting dependency
        run: pip install cloudinary

      - name: Upload saved photo to Cloudinary
        id: host
        env:
          CLOUDINARY_RAW: ${{ secrets.CLOUDINARY_URL }}
        run: |
          python - <<'PY' > result.json
          import os,json
          raw=os.environ['CLOUDINARY_RAW'].strip().strip('"').strip("'")
          if raw.startswith('CLOUDINARY_URL='): raw=raw.split('=',1)[1].strip().strip('"').strip("'")
          body=raw[len('cloudinary://'):]; cred,cloud=body.rsplit('@',1); key,secret=cred.split(':',1); cloud=cloud.split('?',1)[0].strip('/')
          import cloudinary,cloudinary.uploader
          cloudinary.config(cloud_name=cloud,api_key=key,api_secret=secret,secure=True)
          r=cloudinary.uploader.upload('inside-nepal-package/inside-nepal-photo.jpg',resource_type='image',folder='inside-nepal-production/cards',overwrite=False)
          print(json.dumps({'url':r['secure_url']}))
          PY
          echo "url=$(jq -r '.url' result.json)" >> "$GITHUB_OUTPUT"

      - name: Publish saved photo to Buffer
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          IMAGE_URL: ${{ steps.host.outputs.url }}
        run: |
          set -euo pipefail
          POST_TEXT=$(jq -r '.text' inside-nepal-package/publish.json)
          DUE_AT=$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:00.000Z')
          QUERY='mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id dueAt status } } ... on MutationError { message } } }'
          jq -n --arg query "$QUERY" --arg text "$POST_TEXT" --arg channel "$BUFFER_CHANNEL_ID" --arg due "$DUE_AT" --arg image "$IMAGE_URL" '{query:$query,variables:{input:{text:$text,channelId:$channel,metadata:{facebook:{type:"post"}},schedulingType:"automatic",mode:"customScheduled",dueAt:$due,assets:[{image:{url:$image}}]}}}' > buffer.json
          HTTP=$(curl -sS -o response.json -w '%{http_code}' -X POST 'https://api.buffer.com' -H 'Content-Type: application/json' -H "Authorization: Bearer $BUFFER_API_TOKEN" --data-binary @buffer.json)
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1
          ERR=$(jq -r '.errors[0].message // .data.createPost.message // empty' response.json); ID=$(jq -r '.data.createPost.post.id // empty' response.json)
          [ -z "$ERR" ] && [ -n "$ID" ] || { echo "$ERR"; exit 1; }
          echo "Inside Nepal saved photo published: $ID"
