name: Inside Nepal Hindu Manual Only

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Manual Hindu post slot
        required: true
        default: reel_story
        type: choice
        options:
          - reel_morning
          - photo_morning
          - reel_afternoon
          - photo_evening
          - reel_story

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        working-directory: private-code
        run: pip install -r requirements.txt
      - name: Locate FFmpeg
        working-directory: private-code
        run: |
          FFMPEG_PATH="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFMPEG_BIN=$FFMPEG_PATH" >> "$GITHUB_ENV"
      - name: Run manual Hindu content
        working-directory: private-code
        env:
          POST_SLOT: ${{ inputs.slot }}
          AUTO_PUBLISH: 'true'
          HISTORY_PATH: ../hindu-post-history.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FFMPEG_BIN: ${{ env.FFMPEG_BIN }}
        run: python hindu_no_text_runner.py
