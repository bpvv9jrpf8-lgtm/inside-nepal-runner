name: Azure Sagar Nepali Voice Sample

on:
  workflow_dispatch:

jobs:
  generate-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests==2.32.5

      - name: Generate Azure Sagar Human V2 samples
        working-directory: private-code
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python azure_sagar_sample.py

      - name: Upload Human V2 samples
        uses: actions/upload-artifact@v4
        with:
          name: azure-sagar-human-v2-samples
          path: |
            private-code/output/azure-sagar-warm-local.mp3
            private-code/output/azure-sagar-casual-nepali.mp3
            private-code/output/azure-sagar-creator-news.mp3
          retention-days: 1
