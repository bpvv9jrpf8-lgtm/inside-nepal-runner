name: Inside Nepal Generate Package

on:
  workflow_dispatch:
  schedule:
    # 6 shared packages/day. Each package feeds one photo + one reel.
    - cron: '15 0,4,8,12,16,20 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: inside-nepal-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private automation code
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/inside-nepal-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install requirements
        run: |
          pip install -r private-code/requirements.txt

      - name: Resolve Nepal slot metadata
        id: slot
        shell: bash
        run: |
          set -euo pipefail
          UTC_HOUR=$((10#$(date -u +%H)))
          NPT_HOUR=$(((UTC_HOUR + 6) % 24))
          printf -v NPT_PAD '%02d' "$NPT_HOUR"
          echo "hour_pad=$NPT_PAD" >> "$GITHUB_OUTPUT"

      - name: Generate one verified 4-news package and fixed card
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSIDE_NEPAL_POST_KIND: photo
          INSIDE_NEPAL_SLOT_HOUR: ${{ steps.slot.outputs.hour_pad }}
        run: python mixed_post.py

      - name: Build immutable shared package
        env:
          SLOT: ${{ steps.slot.outputs.hour_pad }}
        run: |
          set -euo pipefail
          mkdir -p inside-nepal-package
          cp private-code/output-mixed/inside-nepal-photo.jpg inside-nepal-package/inside-nepal-photo.jpg
          cp private-code/output-mixed/post.json inside-nepal-package/content.json
          CAPTION=$(jq -r '.caption' private-code/output-mixed/post.json)
          jq -n --arg text "$CAPTION" --arg slot "$SLOT" '{kind:"photo",text:$text,slot_npt:$slot,image_file:"inside-nepal-photo.jpg",template:"INSIDE_NEPAL_4_NEWS_SHARED_V2"}' > inside-nepal-package/publish.json

      - name: Upload saved shared package
        uses: actions/upload-artifact@v4
        with:
          name: inside-nepal-package-${{ github.run_id }}
          path: inside-nepal-package/
          if-no-files-found: error
          retention-days: 7
